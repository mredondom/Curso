<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f4f7fb">
  <title>Mi primera página</title>
  <link rel="stylesheet" href="styles.css">
  <script src="main.js" defer></script>
</head>
<body>
  <main class="tarjeta">
    <span class="etiqueta">MI ESPACIO EN LA WEB</span>
    <h1>¡Hola, mundo!</h1>
    <p id="mensaje">Esta es mi primera página web. Me alegra que estés aquí.</p>
    <button id="boton-saludo" type="button">Ver otro saludo</button>
  </main>

  <div class="reloj" id="reloj" role="img" aria-label="Reloj analógico">
    <span class="aguja aguja-hora" id="aguja-hora"></span>
    <span class="aguja aguja-minuto" id="aguja-minuto"></span>
    <span class="aguja aguja-segundo" id="aguja-segundo"></span>
    <span class="reloj-centro"></span>
  </div>

  <footer>Hecho con cariño · <span id="anio"></span></footer>
</body>
</html>
